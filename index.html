<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Armada Happy Birthday 2025 By AAC</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ページロード時の黒レイヤー */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease-out;
        }
        #overlay > div {
            color: #fff;
            margin: 30px;
        }
        #overlay .title {
            font-size: 30px;
        }
        #startButton {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #ffcc00;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* 背景 */
        #container {
            width: 100vw;
            height: calc(100vh - 130px);
            background: url("image2.png") no-repeat center center/cover;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ボタンエリアを #container の外側に配置 */
        .btnarea {
            width: 100vw;
            min-height: 60px;
            text-align: center;
            padding: 10px;
            padding-bottom:60px;

            background: rgba(0, 0, 0, 0.7);
            position: relative;
        }
        .control-button {
            padding: 8px 15px;
            font-size: 12px;
            border: none;
            cursor: pointer;
            color: white;
            margin: 5px;
        }
        #playbgm { background-color: green; }
        #stopbgm { background-color: red; }
        #resetButton { background-color: gray; }

        /* デバッグエリア */
        #waku {
            width: 300px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .mes {
            font-weight: bold;
            color: #000;
            text-align: center;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .debug-area {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .debug-area img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 動画レイヤー */
        #video-layer {
            position: fixed;
            width: 0;
            height: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: width 0.5s, height 0.5s, opacity 0.3s;
            opacity: 0;
        }
              /* 動画レイヤー */
              #video-layer {
            position: fixed;
            width: 0;
            height: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none; /* 最初は非表示 */
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        #video-layer video {
            width: 100%;
            height: 100%;
            max-width: 95vw;
            max-height: 95vh;
        }
        #close-video {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

    <!-- ページロード時の黒レイヤー -->
    <div id="overlay">
        <div class="title">アルマダさんとひとつ屋根の下のなかまたち</div>
        <div>このページは音楽が流れます<br>音量に気を付けてください</div>
        <button id="startButton">⇒ Start</button>
    </div>


    <!-- 背景コンテナ -->
    <div id="container">
        <div id="waku">
            <div class="mes">みんなからのメッセージ</div>
            <div class="debug-area"><img src="banner4.png" data-video="video1.mp4"></div>
            <div class="debug-area"><img src="banner1.png" data-video="video2.mp4"></div>
            <div class="debug-area"><img src="banner2.png" data-video="video3.mp4"></div>
            <div class="debug-area"><img src="banner3.png" data-video="video4.mp4"></div>
            <div class="debug-area"><img src="banner5.png" data-video="video5.mp4"></div>
        </div>
    </div>

    <!-- ボタンエリア (containerの外側) -->
    <div class="btnarea">
        <button id="playbgm" class="control-button">BGM ON</button>
        <button id="stopbgm" class="control-button">BGM OFF</button>
        <button id="resetButton" class="control-button">最初に戻る</button>
    </div>

    <!-- 動画レイヤー -->
    <div id="video-layer">
        <video id="video-player" controls playsinline></video>
        <button id="close-video">✖ 閉じる</button>
    </div>

    <script>
        let videoPlayer = document.getElementById("video-player");
        let videoLayer = document.getElementById("video-layer");
        let bgmPlaying = false;
        let currentAudio = null;
        const bgm = new Audio("bgm.mp3");
        bgm.loop = true;
        bgm.volume = 0.4;
        // BGM再生
        function playBGM() {
            bgm.play().catch(error => console.log("BGM再生エラー:", error));
        }
        
        // BGM停止
        function stopBGM() {
            bgm.pause();
            bgm.currentTime = 5;
        }
         // 動画レイヤーを開く
         document.querySelectorAll(".debug-area img").forEach(img => {
            img.addEventListener("click", function() {
                videoLayer.style.display = "flex"; // 表示
                videoLayer.style.width = "80vw";
                videoLayer.style.height = "80vh";
                videoLayer.style.opacity = "1";
                document.getElementById("close-video").style.display = "block";
                videoPlayer.src = this.dataset.video;
                videoPlayer.play();
                // 動画が終了したらレイヤーを閉じる
                videoPlayer.onended = function() {
                    closeVideoLayer();
                };
            });
        });
        // 閉じるボタンの処理
        document.getElementById("close-video").addEventListener("click", function() {
            closeVideoLayer();
        });

        // 動画レイヤーを閉じる関数
        function closeVideoLayer() {
            videoLayer.style.opacity = "0"; // フェードアウト

            setTimeout(() => {
                videoLayer.style.display = "none"; // 完全に非表示
                videoLayer.style.width = "0px";
                videoLayer.style.height = "0px";
                videoPlayer.pause();
                videoPlayer.currentTime = 0;
            }, 300); // 300ms 後に `display: none;` を適用
        }

        
        // ページが非アクティブになったときに BGM を停止
        document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
                stopBGM();
            }
        });
        
        // ページが完全に閉じられたときに BGM を停止（LINEブラウザ対応）
        window.addEventListener("pagehide", function () {
            stopBGM();
        });
        
        // iOS / LINE の「戻るボタン」対策
        window.addEventListener("beforeunload", function () {
            stopBGM();
        });

        
        // Startボタン
        document.getElementById("startButton").addEventListener("click", function() {
        document.getElementById("overlay").style.opacity = "0";
        setTimeout(() => { document.getElementById("overlay").style.display = "none"; }, 1000);

        // BGMを再生
        bgm.play().catch(error => console.log("BGM再生エラー:", error));
        bgm.currentTime = 5;
        bgmPlaying = true;

        // BGMボタンの制御
        document.getElementById("playbgm").disabled = false; // BGM ON ボタンを有効化
        document.getElementById("stopbgm").disabled = false;


        // BGM再生ボタン
        document.getElementById("playbgm").addEventListener("click", function() {
            if (!bgmPlaying) {
                bgm.play();
                bgm.currentTime = 5;
                bgmPlaying = true;
                this.disabled = true;  // BGM ON ボタンを無効化
                document.getElementById("stopbgm").disabled = false;  // BGM OFF ボタンを有効化
            }
        });

        // BGM停止ボタン
        document.getElementById("stopbgm").addEventListener("click", function() {
            if (bgmPlaying) {
                bgm.pause();
                bgm.currentTime = 0;
                bgmPlaying = false;
                this.disabled = true;  // BGM OFF ボタンを無効化
                document.getElementById("playbgm").disabled = false;  // BGM ON ボタンを有効化
            }
        });

    });
    document.getElementById("resetButton").addEventListener("click", () => location.reload());
       
</script>
</body>
</html>
